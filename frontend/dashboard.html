
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Work Coach</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            color: #222;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .navbar h2 { margin: 0; }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font: inherit;
        }

        textarea { resize: vertical; min-height: 100px; }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        button:disabled { opacity: .6; cursor: not-allowed; }

        .create-btn { background: #2ecc71; color: white; }
        .update-btn { background: #3498db; color: white; }
        .delete-btn, .logout-btn { background: #e74c3c; color: white; }

        .task {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .task h3 { margin-top: 0; }

        .ai-box {
            background: #f0f8ff;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .ai-box h4 { margin-top: 18px; margin-bottom: 8px; }
        .ai-box li { margin-bottom: 6px; }
        .ai-analyzing { color: #2980b9; font-weight: bold; }
        .ai-completed { color: #27ae60; font-weight: bold; }
        .ai-failed { color: #e74c3c; font-weight: bold; }
        .ai-text { white-space: pre-wrap; line-height: 1.6; }

        .skill-gap, .user-skill {
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
        }

        .user-skill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .user-skill h4 { margin: 0 0 8px; }
        .skill-level { color: #555; font-size: 14px; }
        .skill-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .skill-actions button { margin: 0; }
        #message, #skillsMessage { margin: 12px 0; font-weight: bold; }
        .muted { color: #666; }
        .task-buttons { margin-top: 15px; }
        .task-buttons button { margin-bottom: 5px; }

        @media (max-width: 600px) {
            .container { width: 94%; margin: 15px auto; }
            .card { padding: 15px; }
            .navbar { padding: 12px; }
            .navbar h2 { font-size: 18px; }
        }
    </style>
</head>

<body>
<div class="navbar">
    <h2>Junior Developer Work Coach</h2>
    <button id="logoutBtn" class="logout-btn">Logout</button>
</div>

<div class="container">
    <div id="message" role="status"></div>

    <div class="card">
        <h2>Create Task</h2>

        <label for="title">Task Title</label>
        <input id="title" type="text" placeholder="Enter task title">

        <label for="description">Task Description</label>
        <textarea id="description" placeholder="Describe the task..."></textarea>

        <label for="priority">Priority</label>
        <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
        </select>

        <button class="create-btn" id="createTaskBtn">Create Task</button>
    </div>

    <div class="card">
        <h2>My Tasks</h2>
        <div id="taskList">Loading tasks...</div>
    </div>

    <div class="card" id="skillsSection">
        <h2>My Skills</h2>
        <p>Manage your technical skills and track your proficiency.</p>

        <div id="skillsMessage" role="status"></div>

        <label for="skillSelect">Select Skill</label>
        <select id="skillSelect">
            <option value="">Loading available skills...</option>
        </select>

        <label for="skillLevel">Proficiency Level</label>
        <select id="skillLevel">
            <option value="1">1 - Beginner</option>
            <option value="2">2 - Basic</option>
            <option value="3">3 - Intermediate</option>
            <option value="4">4 - Advanced</option>
            <option value="5">5 - Expert</option>
        </select>

        <button class="create-btn" id="addSkillBtn">Add Skill</button>

        <hr style="margin:25px 0">
        <h3>Your Skills</h3>
        <div id="userSkillsList">Loading your skills...</div>
    </div>
</div>

<script>
"use strict";

const API_URL = "http://127.0.0.1:8000";

const token =
    localStorage.getItem("access_token") ||
    localStorage.getItem("token");

const activeAIPolls = new Set();
const taskCache = new Map();

let idempotencyKey = null;

if (!token) {
    window.location.replace("index.html");
}

/* -------------------- COMMON HELPERS -------------------- */

function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function showMessage(message, isError = false) {
    const box = document.getElementById("message");
    box.textContent = message;
    box.style.color = isError ? "#e74c3c" : "#27ae60";
}

function showSkillsMessage(message, isError = false) {
    const box = document.getElementById("skillsMessage");
    box.textContent = message;
    box.style.color = isError ? "#e74c3c" : "#27ae60";
}

function sleep(milliseconds) {
    return new Promise(resolve => setTimeout(resolve, milliseconds));
}

function generateIdempotencyKey() {
    if (window.crypto && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
    }

    return "task-" + Date.now() + "-" +
        Math.random().toString(36).slice(2);
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("access_token");
    window.location.href = "index.html";
}

async function readResponse(response) {
    const text = await response.text();

    if (!text) return {};

    try {
        return JSON.parse(text);
    } catch {
        return { detail: text };
    }
}

function getTaskObject(data) {
    // Supports endpoints returning a task directly or wrapped in an object.
    if (data && data.task && typeof data.task === "object") {
        return data.task;
    }

    if (data && data.data && typeof data.data === "object") {
        if (data.data.task && typeof data.data.task === "object") {
            return data.data.task;
        }
        return data.data;
    }

    return data;
}

function getTaskId(task) {
    return task && (task.id ?? task.task_id);
}

function getAIExplanation(task) {
    if (!task) return null;

    return task.ai_explanation ??
        task.ai_analysis ??
        task.analysis ??
        task.ai_result ??
        null;
}

function getAIStatus(task) {
    if (!task) return "pending";

    const status = String(
        task.ai_status ?? task.analysis_status ?? ""
    ).toLowerCase();

    const explanation = getAIExplanation(task);

    // A saved explanation is more useful than a stale status field.
    if (explanation !== null && explanation !== undefined &&
        explanation !== "") {
        if (["failed", "error"].includes(status)) return "failed";
        return "completed";
    }

    if (["completed", "complete", "success", "succeeded"].includes(status)) {
        return "completed";
    }

    if (["failed", "error"].includes(status)) {
        return "failed";
    }

    return "pending";
}

/* -------------------- AUTHENTICATION -------------------- */

document.getElementById("logoutBtn").addEventListener("click", logout);

/* -------------------- TASK CREATION -------------------- */

document.getElementById("createTaskBtn").addEventListener("click", createTask);

async function createTask() {
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const priority = document.getElementById("priority").value;
    const button = document.getElementById("createTaskBtn");

    if (!title || !description) {
        showMessage("Please enter both title and description.", true);
        return;
    }

    if (!idempotencyKey) {
        idempotencyKey = generateIdempotencyKey();
    }

    button.disabled = true;

    try {
        const response = await fetch(`${API_URL}/task`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`,
                "Idempotency-Key": idempotencyKey
            },
            body: JSON.stringify({ title, description, priority })
        });

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(
                data.detail || data.message || "Failed to create task."
            );
        }

        const task = getTaskObject(data);
        const taskId = getTaskId(task);

        // Retain the key if the request failed. Reset it only after success.
        idempotencyKey = null;

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        document.getElementById("priority").value = "Medium";

        showMessage("Task created successfully. Loading AI analysis...");

        if (task && taskId !== undefined && taskId !== null) {
            taskCache.set(String(taskId), task);
        }

        await loadTasks();

        if (taskId !== undefined && taskId !== null) {
            pollAIStatus(taskId);
        }

    } catch (error) {
        console.error("CREATE TASK ERROR:", error);
        showMessage("Error: " + error.message, true);
    } finally {
        button.disabled = false;
    }
}

/* -------------------- LOAD TASKS -------------------- */

async function loadTasks() {
    const taskList = document.getElementById("taskList");

    try {
        const response = await fetch(`${API_URL}/task`, {
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Failed to load tasks.");
        }

        // Supports a normal array or a wrapped list response.
        let tasks = Array.isArray(data)
            ? data
            : (data.tasks ?? data.items ?? data.results ?? []);

        if (!Array.isArray(tasks)) {
            throw new Error("The task-list endpoint did not return a task array.");
        }

        taskList.innerHTML = "";

        if (tasks.length === 0) {
            taskList.textContent = "No tasks yet.";
            return;
        }

        for (const task of tasks) {
            const id = getTaskId(task);

            if (id !== undefined && id !== null) {
                taskCache.set(String(id), task);
            }

            renderTask(task);
        }

        // Resume polling for tasks that have not finished analysis.
        for (const task of tasks) {
            const id = getTaskId(task);

            if (id !== undefined && id !== null &&
                getAIStatus(task) === "pending") {
                pollAIStatus(id);
            }
        }

    } catch (error) {
        console.error("LOAD TASKS ERROR:", error);
        taskList.textContent = "Could not load tasks: " + error.message;
    }
}

/* -------------------- RENDER TASK -------------------- */

function renderTask(task) {
    const taskList = document.getElementById("taskList");
    const taskDiv = document.createElement("div");
    taskDiv.className = "task";

    const title = escapeHtml(task.title || "Untitled task");
    const description = escapeHtml(task.description || "");
    const status = escapeHtml(task.status || "Pending");
    const priority = escapeHtml(task.priority || "Medium");
    const id = getTaskId(task);

    taskDiv.innerHTML = `
        <h3>${title}</h3>

        <p><strong>Description:</strong> ${description}</p>
        <p><strong>Status:</strong> ${status}</p>
        <p><strong>Priority:</strong> ${priority}</p>

        ${createAIHTML(task)}

        <div class="task-buttons">
            <button class="update-btn" data-action="update">Update</button>
            <button class="delete-btn" data-action="delete">Delete</button>
        </div>
    `;

    taskDiv.querySelector('[data-action="update"]').addEventListener(
        "click", () => updateTask(id)
    );

    taskDiv.querySelector('[data-action="delete"]').addEventListener(
        "click", () => deleteTask(id)
    );

    taskList.appendChild(taskDiv);
}

/* -------------------- DISPLAY AI ANALYSIS -------------------- */

function createAIHTML(task) {
    const status = getAIStatus(task);
    const explanation = getAIExplanation(task);

    if (status === "failed") {
        return `
            <div class="ai-box">
                <strong>AI Analysis</strong>
                <p class="ai-failed">AI analysis failed.</p>
                <p>Your task is still saved. Check the backend logs for the AI error.</p>
            </div>
        `;
    }

    // Do not show the loading message if an explanation already exists.
    if (explanation !== null && explanation !== undefined &&
        explanation !== "") {
        return buildAIExplanationHTML(explanation);
    }

    if (status === "pending") {
        return `
            <div class="ai-box">
                <strong>AI Analysis</strong>
                <p class="ai-analyzing">Analyzing task...</p>
                <p>Gemini is preparing your learning guidance.</p>
            </div>
        `;
    }

    return `
        <div class="ai-box">
            <strong>AI Analysis</strong>
            <p>No AI explanation was returned by the backend.</p>
        </div>
    `;
}

function buildAIExplanationHTML(rawExplanation) {
    let aiData = rawExplanation;

    if (typeof aiData === "string") {
        const trimmed = aiData.trim();

        if (!trimmed) {
            return `
                <div class="ai-box">
                    <strong>AI Analysis</strong>
                    <p>No AI explanation available.</p>
                </div>
            `;
        }

        try {
            aiData = JSON.parse(trimmed);
        } catch {
            // Plain-text Gemini responses are displayed as text.
            return `
                <div class="ai-box">
                    <strong>AI Analysis</strong>
                    <p class="ai-completed">Analysis available</p>
                    <div class="ai-text">${escapeHtml(trimmed)}</div>
                </div>
            `;
        }
    }

    // Some APIs wrap the analysis in another object.
    if (aiData && typeof aiData === "object") {
        aiData = aiData.analysis ??
            aiData.result ??
            aiData.ai_explanation ??
            aiData;
    }

    if (typeof aiData === "string") {
        return `
            <div class="ai-box">
                <strong>AI Analysis</strong>
                <p class="ai-completed">Analysis available</p>
                <div class="ai-text">${escapeHtml(aiData)}</div>
            </div>
        `;
    }

    if (!aiData || typeof aiData !== "object") {
        return `
            <div class="ai-box">
                <strong>AI Analysis</strong>
                <p>No readable AI explanation was returned.</p>
            </div>
        `;
    }

    return buildStructuredAIHTML(aiData);
}

function toArray(value) {
    if (Array.isArray(value)) return value;
    if (value === null || value === undefined || value === "") return [];
    return [value];
}

function displayValue(value) {
    if (value === null || value === undefined) return "";
    if (typeof value === "string" || typeof value === "number") {
        return escapeHtml(value);
    }

    return escapeHtml(JSON.stringify(value, null, 2));
}

function buildStructuredAIHTML(aiData) {
    const explanation =
        aiData.task_explanation ??
        aiData.explanation ??
        aiData.summary ??
        aiData.task_understanding ??
        "";

    const requiredSkills = toArray(
        aiData.required_skills ?? aiData.skills_required
    );

    const skillGaps = toArray(
        aiData.skill_gaps ?? aiData.skills_to_learn
    );

    const learningOrder = toArray(
        aiData.learning_order ??
        aiData.learning_steps ??
        aiData.steps_to_follow
    );

    const checklist = toArray(
        aiData.pre_coding_checklist ??
        aiData.checklist ??
        aiData.before_coding
    );

    const filesToRead = toArray(
        aiData.first_files_to_read ??
        aiData.files_to_read ??
        aiData.recommended_files
    );

    const codeGuidance = toArray(
        aiData.code_guidance ??
        aiData.implementation_guidance ??
        aiData.code_examples
    );

    function listHTML(items) {
        if (!items.length) {
            return "<li>No items provided.</li>";
        }

        return items.map(item => {
            if (typeof item === "object" && item !== null) {
                const text = item.step ??
                    item.name ??
                    item.skill ??
                    item.title ??
                    item.description ??
                    JSON.stringify(item);

                return `<li>${escapeHtml(text)}</li>`;
            }

            return `<li>${escapeHtml(item)}</li>`;
        }).join("");
    }

    function skillGapHTML(items) {
        if (!items.length) {
            return "<p>No specific skill gaps provided.</p>";
        }

        return items.map(gap => {
            if (typeof gap !== "object" || gap === null) {
                return `<div class="skill-gap">${escapeHtml(gap)}</div>`;
            }

            const skill = gap.skill ?? gap.name ?? gap.title ?? "Skill";
            const detail = gap.what_to_learn ??
                gap.description ??
                gap.reason ??
                gap.recommendation ??
                "";

            return `
                <div class="skill-gap">
                    <strong>${escapeHtml(skill)}</strong>
                    <p>${escapeHtml(detail)}</p>
                </div>
            `;
        }).join("");
    }

    function section(title, content) {
        return `
            <h4>${escapeHtml(title)}</h4>
            ${content}
        `;
    }

    let extraSections = "";

    // Display additional analysis fields rather than silently discarding them.
    const knownKeys = new Set([
        "task_explanation", "explanation", "summary", "task_understanding",
        "required_skills", "skills_required", "skill_gaps", "skills_to_learn",
        "learning_order", "learning_steps", "steps_to_follow",
        "pre_coding_checklist", "checklist", "before_coding",
        "first_files_to_read", "files_to_read", "recommended_files",
        "code_guidance", "implementation_guidance", "code_examples"
    ]);

    for (const [key, value] of Object.entries(aiData)) {
        if (knownKeys.has(key) || value === null || value === undefined) {
            continue;
        }

        const heading = key
            .replaceAll("_", " ")
            .replace(/\b\w/g, letter => letter.toUpperCase());

        let content;

        if (Array.isArray(value)) {
            content = `<ul>${listHTML(value)}</ul>`;
        } else if (typeof value === "object") {
            content = `<pre class="ai-text">${escapeHtml(
                JSON.stringify(value, null, 2)
            )}</pre>`;
        } else {
            content = `<div class="ai-text">${escapeHtml(value)}</div>`;
        }

        extraSections += section(heading, content);
    }

    return `
        <div class="ai-box">
            <strong>AI Analysis</strong>
            <p class="ai-completed">Analysis available</p>

            ${section(
                "Task Explanation",
                `<div class="ai-text">${displayValue(explanation) || "No explanation provided."}</div>`
            )}

            ${section("Required Skills", `<ul>${listHTML(requiredSkills)}</ul>`)}

            ${section("Skill Gaps", skillGapHTML(skillGaps))}

            ${section("Learning Order", `<ol>${listHTML(learningOrder)}</ol>`)}

            ${section("Before Coding Checklist", `<ul>${listHTML(checklist)}</ul>`)}

            ${filesToRead.length
                ? section("Files to Read First", `<ul>${listHTML(filesToRead)}</ul>`)
                : ""}

            ${codeGuidance.length
                ? section("Code Guidance", `<ul>${listHTML(codeGuidance)}</ul>`)
                : ""}

            ${extraSections}
        </div>
    `;
}

/* -------------------- POLL AI STATUS -------------------- */

async function pollAIStatus(taskId) {
    const key = String(taskId);

    if (activeAIPolls.has(key)) return;

    activeAIPolls.add(key);

    try {
        // Up to five minutes, with a delay between requests.
        for (let attempt = 0; attempt < 150; attempt++) {
            const response = await fetch(`${API_URL}/task/${encodeURIComponent(key)}`, {
                method: "GET",
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (response.status === 401) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error(`AI status request failed: HTTP ${response.status}`);
            }

            const responseData = await readResponse(response);
            const task = getTaskObject(responseData);

            console.log("LATEST TASK RESPONSE:", task);
            console.log("AI STATUS:", task.ai_status);
            console.log("AI EXPLANATION:", getAIExplanation(task));

            const returnedId = getTaskId(task);
            const resolvedId = returnedId ?? taskId;

            taskCache.set(String(resolvedId), task);

            if (getAIStatus(task) === "completed" ||
                getAIStatus(task) === "failed") {
                await loadTasks();
                return;
            }

            await sleep(2000);
        }

        console.warn("AI analysis is still pending:", taskId);
        showMessage(
            "AI analysis is taking longer than expected. Your task is saved; check again shortly.",
            true
        );

    } catch (error) {
        console.error("AI POLLING ERROR:", error);
        showMessage("Could not refresh AI analysis: " + error.message, true);
    } finally {
        activeAIPolls.delete(key);
    }
}

/* -------------------- UPDATE TASK -------------------- */

async function updateTask(taskId) {
    if (taskId === null || taskId === undefined) {
        showMessage("Cannot update task: task ID is missing.", true);
        return;
    }

    const newTitle = prompt("Enter new title:");
    if (newTitle === null) return;

    const newDescription = prompt("Enter new description:");
    if (newDescription === null) return;

    if (!newTitle.trim() || !newDescription.trim()) {
        showMessage("Title and description cannot be empty.", true);
        return;
    }

    try {
        const response = await fetch(
            `${API_URL}/task/${encodeURIComponent(taskId)}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    title: newTitle.trim(),
                    description: newDescription.trim(),
                    status: "Pending",
                    priority: "Medium"
                })
            }
        );

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Failed to update task.");
        }

        showMessage("Task updated successfully.");
        await loadTasks();

    } catch (error) {
        console.error("UPDATE TASK ERROR:", error);
        showMessage("Error: " + error.message, true);
    }
}

/* -------------------- DELETE TASK -------------------- */

async function deleteTask(taskId) {
    if (!confirm("Are you sure you want to delete this task?")) return;

    try {
        const response = await fetch(
            `${API_URL}/task/${encodeURIComponent(taskId)}`,
            {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            }
        );

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Failed to delete task.");
        }

        taskCache.delete(String(taskId));
        showMessage("Task deleted successfully.");
        await loadTasks();

    } catch (error) {
        console.error("DELETE TASK ERROR:", error);
        showMessage("Error: " + error.message, true);
    }
}

/* -------------------- AVAILABLE SKILLS -------------------- */

async function loadAvailableSkills() {
    const select = document.getElementById("skillSelect");
    select.innerHTML = '<option value="">Loading available skills...</option>';

    try {
        const response = await fetch(`${API_URL}/users/me/skills/available`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Could not load available skills.");
        }

        const skills = Array.isArray(data)
            ? data
            : (data.skills ?? data.items ?? []);

        select.innerHTML = '<option value="">Select a skill</option>';

        for (const skill of skills) {
            const option = document.createElement("option");
            option.value = skill.id;
            option.textContent = skill.name;
            select.appendChild(option);
        }

        if (skills.length === 0) {
            select.innerHTML = '<option value="">No skills available</option>';
        }

    } catch (error) {
        console.error("LOAD AVAILABLE SKILLS ERROR:", error);
        select.innerHTML = '<option value="">Could not load skills</option>';
        showSkillsMessage(error.message, true);
    }
}

/* -------------------- USER SKILLS -------------------- */

async function loadMySkills() {
    const list = document.getElementById("userSkillsList");
    list.textContent = "Loading your skills...";

    try {
        const response = await fetch(`${API_URL}/users/me/skills/`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Could not load your skills.");
        }

        const skills = Array.isArray(data)
            ? data
            : (data.skills ?? data.items ?? []);

        list.innerHTML = "";

        if (skills.length === 0) {
            list.textContent = "You haven't added any skills yet.";
            return;
        }

        for (const skill of skills) {
            const div = document.createElement("div");
            div.className = "user-skill";

            const details = document.createElement("div");
            const heading = document.createElement("h4");
            heading.textContent = skill.skill_name ?? skill.name ?? "Skill";

            const level = document.createElement("p");
            level.className = "skill-level";
            level.textContent = `Proficiency Level: ${skill.level}/5`;

            details.append(heading, level);

            const actions = document.createElement("div");
            actions.className = "skill-actions";

            const updateButton = document.createElement("button");
            updateButton.className = "update-btn";
            updateButton.textContent = "Update Level";
            updateButton.addEventListener("click", () => {
                updateUserSkill(skill.id, skill.level);
            });

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Remove";
            deleteButton.addEventListener("click", () => {
                deleteUserSkill(
                    skill.id,
                    skill.skill_name ?? skill.name ?? "this skill"
                );
            });

            actions.append(updateButton, deleteButton);
            div.append(details, actions);
            list.appendChild(div);
        }

    } catch (error) {
        console.error("LOAD MY SKILLS ERROR:", error);
        list.textContent = "Could not load your skills.";
        showSkillsMessage(error.message, true);
    }
}

/* -------------------- ADD SKILL -------------------- */

document.getElementById("addSkillBtn").addEventListener("click", addUserSkill);

async function addUserSkill() {
    const skillId = document.getElementById("skillSelect").value;
    const level = Number(document.getElementById("skillLevel").value);
    const button = document.getElementById("addSkillBtn");

    if (!skillId) {
        showSkillsMessage("Please select a skill.", true);
        return;
    }

    button.disabled = true;

    try {
        const response = await fetch(`${API_URL}/users/me/skills/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                skill_id: Number(skillId),
                level: level
            })
        });

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Failed to add skill.");
        }

        showSkillsMessage(
            `${data.skill_name ?? data.name ?? "Skill"} added successfully!`
        );

        document.getElementById("skillSelect").value = "";
        document.getElementById("skillLevel").value = "1";

        await loadMySkills();
        await loadAvailableSkills();

    } catch (error) {
        console.error("ADD SKILL ERROR:", error);
        showSkillsMessage(error.message, true);
    } finally {
        button.disabled = false;
    }
}

/* -------------------- UPDATE SKILL -------------------- */

async function updateUserSkill(userSkillId, currentLevel) {
    const newLevel = prompt(
        "Enter new proficiency level (1 to 5):\n" +
        "1 = Beginner\n2 = Basic\n3 = Intermediate\n" +
        "4 = Advanced\n5 = Expert",
        currentLevel
    );

    if (newLevel === null) return;

    const level = Number(newLevel);

    if (!Number.isInteger(level) || level < 1 || level > 5) {
        showSkillsMessage("Please enter a whole number from 1 to 5.", true);
        return;
    }

    try {
        const response = await fetch(
            `${API_URL}/users/me/skills/${encodeURIComponent(userSkillId)}`,
            {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ level })
            }
        );

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Failed to update skill.");
        }

        showSkillsMessage(
            `${data.skill_name ?? data.name ?? "Skill"} level updated successfully!`
        );

        await loadMySkills();

    } catch (error) {
        console.error("UPDATE SKILL ERROR:", error);
        showSkillsMessage(error.message, true);
    }
}

/* -------------------- REMOVE SKILL -------------------- */

async function deleteUserSkill(userSkillId, skillName) {
    if (!confirm(`Are you sure you want to remove "${skillName}" from your profile?`)) {
        return;
    }

    try {
        const response = await fetch(
            `${API_URL}/users/me/skills/${encodeURIComponent(userSkillId)}`,
            {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            }
        );

        const data = await readResponse(response);

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.detail || "Failed to remove skill.");
        }

        showSkillsMessage(`${skillName} removed from your profile.`);
        await loadMySkills();

    } catch (error) {
        console.error("DELETE SKILL ERROR:", error);
        showSkillsMessage(error.message, true);
    }
}

/* -------------------- INITIAL LOAD -------------------- */

async function initializeDashboard() {
    if (!token) return;

    await Promise.all([
        loadTasks(),
        loadAvailableSkills(),
        loadMySkills()
    ]);
}

initializeDashboard();
</script>
